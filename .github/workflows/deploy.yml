name: OpenBarrio Cloudflare Deployment Pipeline

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Edge
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Notify Missing Cloudflare Credentials
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning title=Missing Cloudflare Credentials::CLOUDFLARE_API_TOKEN secret is not configured in this repository. Deployment skipped. Follow docs/DEPLOYMENT_GUIDE.md to configure secrets."

      - name: Validate Cloudflare Provisioning Status
        id: cf-check
        run: |
          IS_D1_PLACEHOLDER="false"
          if grep -q "00000000-0000-0000-0000-000000000000" apps/api/wrangler.jsonc; then
            IS_D1_PLACEHOLDER="true"
            echo "::warning title=Cloudflare D1 Database ID Needed::apps/api/wrangler.jsonc contains placeholder database_id '00000000-0000-0000-0000-000000000000'. Create your database with 'npx wrangler d1 create openbarrio-d1' and commit the UUID to enable API deployment. See docs/DEPLOYMENT_GUIDE.md."
          fi
          echo "is_d1_placeholder=${IS_D1_PLACEHOLDER}" >> $GITHUB_OUTPUT

      - name: Apply Cloudflare D1 Remote Migrations
        if: env.HAS_CF_TOKEN == 'true' && steps.cf-check.outputs.is_d1_placeholder != 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute openbarrio-d1 --file=migrations/0001_initial_schema.sql --remote --yes

      - name: Deploy API to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true' && steps.cf-check.outputs.is_d1_placeholder != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

      - name: Deploy Web to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          preCommands: npx wrangler pages project create openbarrio-web --production-branch=main || true
          command: pages deploy ../web/dist --project-name=openbarrio-web --branch=main --commit-dirty=true
