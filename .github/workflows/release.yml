name: OpenBarrio Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Run verification tests
        run: pnpm test

      - name: Package Chrome Extension ZIP
        id: package-ext
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.tag }}"
          fi
          ZIP_NAME="openbarrio-extension-${TAG_NAME}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          echo "Packaging extension into ${ZIP_PATH}..."
          (cd apps/extension/dist && zip -r "${ZIP_PATH}" .)
          echo "zip_path=${ZIP_PATH}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ steps.package-ext.outputs.tag_name }}"
          ASSET_PATH="${{ steps.package-ext.outputs.zip_path }}"
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists. Uploading extension asset..."
            gh release upload "$TARGET_TAG" "$ASSET_PATH" --clobber
          else
            echo "Creating new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" "$ASSET_PATH" \
              --title "OpenBarrio $TARGET_TAG" \
              --generate-notes \
              --verify-tag
          fi
