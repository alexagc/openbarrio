name: OpenBarrio Autonomous Data Pipeline (ETL)

on:
  schedule:
    # Run quarterly on the 1st of January, April, July, October at 03:00 UTC
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      all_provinces:
        description: 'Download all 52 Spanish provinces from INE ADRH (default: true)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run only (skip Cloudflare D1/R2 sync)'
        required: false
        default: false
        type: boolean
      run_ine_ign:
        description: 'Run INE ADRH Income & IGN Boundaries ETL'
        required: false
        default: true
        type: boolean
      run_snczi_floods:
        description: 'Run MITECO SNCZI Flood Cartography ETL'
        required: false
        default: true
        type: boolean
      run_sica_noise:
        description: 'Run MITECO SICA Strategic Noise ETL'
        required: false
        default: true
        type: boolean
      run_civic_cee:
        description: 'Run Civic Facilities & Energy Certificates (CEE) ETL'
        required: false
        default: true
        type: boolean
      sync_vut_radon_serpavi:
        description: 'Sync VUT Tourist Housing, CTE Radon & SERPAVI to D1 (default: true)'
        required: false
        default: true
        type: boolean
      sync_civic_cee:
        description: 'Sync Civic Facilities & CEE chunks to Cloudflare D1 (default: true for full runs, set false to skip)'
        required: false
        default: true
        type: boolean
      sync_ine:
        description: 'Sync INE Income to Cloudflare D1 (default: true for full runs, set false to skip)'
        required: false
        default: true
        type: boolean
      sync_snczi_floods:
        description: 'Sync SNCZI Floods to Cloudflare D1 & R2 (default: true for full runs, set false to skip)'
        required: false
        default: true
        type: boolean
      sync_sica_noise:
        description: 'Sync SICA Noise to Cloudflare D1 & R2 (default: true for full runs, set false to skip)'
        required: false
        default: true
        type: boolean
      sync_r2:
        description: 'Sync Vector Cartography to Cloudflare R2 (default: true for full runs, set false to skip)'
        required: false
        default: true
        type: boolean
      skip_integrity_gate:
        description: 'Skip verify-etl-integrity quality gate'
        required: false
        default: false
        type: boolean
      force_sample:
        description: 'Force use of rich seed dataset without remote network downloads'
        required: false
        default: false
        type: boolean
      apply_only:
        description: 'Skip downloads and apply existing artifact directly to Cloudflare D1/R2'
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: 'Run ID of artifact to download (if apply_only is true, default: 41665387431)'
        required: false
        default: '41665387431'
        type: string

permissions:
  contents: write

jobs:
  # =========================================================================
  # Job 1: Ingest & Process INE ADRH + IGN Census Boundaries
  # =========================================================================
  etl-ine-ign:
    name: ETL 1/4 - INE ADRH & IGN Secciones Censales
    runs-on: ubuntu-latest
    if: inputs.apply_only != true && (github.event_name == 'schedule' || inputs.run_ine_ign != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt
          python3 -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL spatial;')"

      - name: Install Tippecanoe & GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev build-essential
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Ingest Public Open Datasets (INE ADRH & Cartography)
        run: |
          mkdir -p packages/etl/data packages/etl/dist
          ARGS="--all-provinces"
          if [ "${{ inputs.force_sample }}" = "true" ]; then
            ARGS="--force-sample"
          elif [ "${{ inputs.all_provinces }}" = "false" ]; then
            ARGS="--metropolitan-only"
          fi
          python3 packages/etl/src/download_datasets.py $ARGS

      - name: Run INE ADRH Processing (DuckDB -> D1 SQL)
        run: |
          python3 packages/etl/src/process_ine_adrh.py \
            --input packages/etl/data/ine_adrh_raw.csv \
            --output-sql packages/etl/dist/ine_adrh.sql \
            --output-db packages/etl/dist/ine_adrh.db

      - name: Run IGN Seccionado Censal Processing (DuckDB Spatial -> PMTiles)
        run: |
          python3 packages/etl/src/process_ign_boundaries.py \
            --input packages/etl/data/ign_secciones_censales.geojson \
            --output-pmtiles packages/etl/dist/census_tracts.pmtiles

      - name: Upload INE & IGN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ine-ign
          path: |
            packages/etl/dist/ine_adrh.sql
            packages/etl/dist/census_tracts.pmtiles
            packages/etl/dist/census_tracts_simplified.geojson
          retention-days: 7

  # =========================================================================
  # Job 2: MITECO SNCZI Flood Cartography Ingestion (28k+ Polygons)
  # =========================================================================
  etl-snczi-floods:
    name: ETL 2/4 - MITECO SNCZI Inundaciones
    runs-on: ubuntu-latest
    if: inputs.apply_only != true && (github.event_name == 'schedule' || inputs.run_snczi_floods != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt
          python3 -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL spatial;')"

      - name: Install Tippecanoe & GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev build-essential
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Run MITECO SNCZI Processing (DuckDB Spatial -> PMTiles & SQL)
        run: |
          mkdir -p packages/etl/dist
          python3 packages/etl/src/process_miteco_snczi.py \
            --output-pmtiles packages/etl/dist/floods.pmtiles \
            --output-sql packages/etl/dist/snczi_risk.sql

      - name: Upload SNCZI Flood Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-snczi-floods
          path: |
            packages/etl/dist/floods.pmtiles
            packages/etl/dist/snczi_risk.sql
          retention-days: 7

  # =========================================================================
  # Job 3: MITECO SICA Strategic Noise Cartography (40k+ Isochrones)
  # =========================================================================
  etl-sica-noise:
    name: ETL 3/4 - MITECO SICA Ruido Estratégico
    runs-on: ubuntu-latest
    if: inputs.apply_only != true && (github.event_name == 'schedule' || inputs.run_sica_noise != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt
          python3 -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL spatial;')"

      - name: Install Tippecanoe & GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev build-essential
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Run MITECO SICA Processing (DuckDB Spatial -> PMTiles & SQL)
        run: |
          mkdir -p packages/etl/dist
          python3 packages/etl/src/process_miteco_sica.py \
            --output-pmtiles packages/etl/dist/noise.pmtiles \
            --output-sql packages/etl/dist/sica_noise.sql

      - name: Upload SICA Noise Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-sica-noise
          path: |
            packages/etl/dist/noise.pmtiles
            packages/etl/dist/sica_noise.sql
          retention-days: 7

  # =========================================================================
  # Job 4: Civic Public Facilities (60k) + Energy Certificates CEE (197k)
  # =========================================================================
  etl-civic-cee:
    name: ETL 4/4 - Equipamientos Cívicos & Certificados CEE
    runs-on: ubuntu-latest
    if: inputs.apply_only != true && (github.event_name == 'schedule' || inputs.run_civic_cee != false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS & pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt
          pnpm install --no-frozen-lockfile

      - name: Run Civic Facilities Processing (Python -> D1 SQL)
        run: |
          mkdir -p packages/etl/dist
          python3 packages/etl/src/process_civic_facilities.py \
            --output-sql packages/etl/dist/civic_facilities.sql

      - name: Ingest Energy Performance Certificates (CEE)
        run: |
          echo "⚡ Ingesting official Open Data Energy Certificates (Madrid, Catalunya, Euskadi)..."
          node scripts/ingest-open-data-cee.mjs

      - name: Upload Civic & CEE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-civic-cee
          path: |
            packages/etl/dist/civic_facilities.sql
            packages/etl/dist/energy_certificates.sql
          retention-days: 7

  # =========================================================================
  # Job 5: Quality Gatekeeper & Aggregator Deployer (D1 & R2 Sync)
  # =========================================================================
  deploy-and-gate:
    name: Gatekeeper & Cloudflare Deployment (D1 & R2)
    runs-on: ubuntu-latest
    needs: [etl-ine-ign, etl-snczi-floods, etl-sica-noise, etl-civic-cee]
    if: always() && (inputs.apply_only == true || inputs.sync_vut_radon_serpavi == true || contains(needs.*.result, 'success'))
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_R2_S3_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Output Directory
        run: mkdir -p packages/etl/dist

      - name: Download Parallel ETL Artifacts
        if: inputs.apply_only != true && contains(needs.*.result, 'success')
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: packages/etl/dist
          merge-multiple: true

      - name: Download Processed National Artifacts (Fast Sync Apply Only)
        if: inputs.apply_only == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_RUN="${{ inputs.artifact_run_id || '41665387431' }}"
          echo "Downloading processed artifacts from workflow run $TARGET_RUN..."
          gh run download "$TARGET_RUN" --dir packages/etl/dist
          if [ -d "packages/etl/dist/openbarrio-etl-dist" ]; then
            cp -r packages/etl/dist/openbarrio-etl-dist/* packages/etl/dist/
          fi
          for d in packages/etl/dist/artifact-*; do
            if [ -d "$d" ]; then
              cp -r "$d"/* packages/etl/dist/
            fi
          done
          echo "Verified downloaded files in packages/etl/dist:"
          ls -lh packages/etl/dist

      - name: Split Cloudflare D1 Chunks (Civic Facilities & Energy Certificates)
        run: |
          node scripts/split-d1-chunks.mjs

      - name: Initialize Local SQLite Database from ETL Artifacts
        if: inputs.apply_only == true || contains(needs.*.result, 'success')
        run: |
          node scripts/init-local-db.mjs

      - name: Run ETL Integrity Quality Gate
        if: inputs.skip_integrity_gate != true && (inputs.apply_only == true || contains(needs.*.result, 'success'))
        run: |
          node scripts/verify-etl-integrity.mjs

      - name: Apply Cloudflare D1 Migrations (Tables & Indexes)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: d1 migrations apply openbarrio-d1 --remote

      - name: Sync Cloudflare D1 (INE Income SQLite)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/ine_adrh.sql') != '' && inputs.sync_ine != false
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/ine_adrh.sql --remote --yes

      - name: Apply Cloudflare D1 Chunks (Civic Facilities & Energy Certificates)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && (github.event_name == 'schedule' || inputs.sync_civic_cee == true)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/apply-d1-chunks.mjs packages/etl/chunks/civic_facilities --remote
          node scripts/apply-d1-chunks.mjs packages/etl/chunks/energy_certificates --remote

      - name: Apply Cloudflare D1 Chunks (VUT Tourist Housing, CTE Radon & SERPAVI)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && inputs.sync_vut_radon_serpavi != false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/apply-d1-chunks.mjs packages/etl/chunks/vut_census_tracts --remote
          node scripts/apply-d1-chunks.mjs packages/etl/chunks/cte_radon --remote
          node scripts/apply-d1-chunks.mjs packages/etl/chunks/serpavi_benchmarks --remote

      - name: Sync Cloudflare D1 (Municipal ITE & IGN Seismic)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/openbarrio-etl-dist/municipal_ite.sql') != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: |
            d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/openbarrio-etl-dist/municipal_ite.sql --remote --yes
            d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/openbarrio-etl-dist/ign_seismic.sql --remote --yes

      - name: Sync Cloudflare D1 (MITECO SNCZI Flood Risk)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/snczi_risk.sql') != '' && inputs.sync_snczi_floods != false
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/snczi_risk.sql --remote --yes

      - name: Sync Cloudflare D1 (MITECO SICA Acoustic Noise)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/sica_noise.sql') != '' && inputs.sync_sica_noise != false
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/sica_noise.sql --remote --yes

      - name: Sync Cloudflare R2 (PMTiles Vector Boundaries)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/census_tracts.pmtiles') != '' && inputs.sync_r2 != false
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: r2 object put openbarrio-r2/census_tracts.pmtiles --file=${{ github.workspace }}/packages/etl/dist/census_tracts.pmtiles

      - name: Sync Cloudflare R2 (MITECO Floods PMTiles via S3 Multipart)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/floods.pmtiles') != '' && inputs.sync_r2 != false
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          CUSTOM_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "==> Configuring S3 credentials for Cloudflare R2..."
          if [ -n "$CUSTOM_R2_KEY" ] && [ -n "$CUSTOM_R2_SECRET" ]; then
            export AWS_ACCESS_KEY_ID="$CUSTOM_R2_KEY"
            export AWS_SECRET_ACCESS_KEY="$CUSTOM_R2_SECRET"
            echo "Using explicitly configured R2 S3 secrets."
          else
            echo "Deriving R2 S3 credentials from verified Cloudflare session..."
            TOKEN_VERIFY=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
            TOKEN_ID=$(echo "$TOKEN_VERIFY" | jq -r '.result.id // empty')
            if [ -n "$TOKEN_ID" ]; then
              export AWS_ACCESS_KEY_ID="$TOKEN_ID"
              export AWS_SECRET_ACCESS_KEY=$(printf "%s" "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
              echo "✓ Configured S3 Access Key ID (masked): ${TOKEN_ID:0:6}***"
            else
              echo "::warning title=R2 S3 Configuration Needed::Could not verify Cloudflare token for automatic S3 multipart upload. Please configure R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY secrets."
            fi
          fi

          export AWS_DEFAULT_REGION=auto
          echo "==> Uploading full national floods.pmtiles (487MB) to Cloudflare R2 via AWS CLI S3 Multipart..."
          aws s3 cp packages/etl/dist/floods.pmtiles "s3://openbarrio-r2/floods.pmtiles" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "✓ floods.pmtiles uploaded successfully to Cloudflare R2!"

      - name: Sync Cloudflare R2 (MITECO Noise PMTiles)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true' && hashFiles('packages/etl/dist/noise.pmtiles') != '' && inputs.sync_r2 != false
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: r2 object put openbarrio-r2/noise.pmtiles --file=${{ github.workspace }}/packages/etl/dist/noise.pmtiles

      - name: Upload Consolidated National Artifacts
        if: inputs.apply_only != true && contains(needs.*.result, 'success')
        uses: actions/upload-artifact@v4
        with:
          name: openbarrio-etl-dist
          path: |
            packages/etl/dist/ine_adrh.sql
            packages/etl/dist/civic_facilities.sql
            packages/etl/dist/energy_certificates.sql
            packages/etl/dist/snczi_risk.sql
            packages/etl/dist/sica_noise.sql
            packages/etl/dist/census_tracts.pmtiles
            packages/etl/dist/floods.pmtiles
            packages/etl/dist/noise.pmtiles
            packages/etl/dist/census_tracts_simplified.geojson
          retention-days: 30

      - name: Update Manifest from Generated Artifacts
        if: inputs.dry_run != true && inputs.apply_only != true && contains(needs.*.result, 'success')
        run: node scripts/update-etl-manifest.mjs

      - name: Persist ETL Manifest Changes to Main
        if: inputs.dry_run != true && inputs.apply_only != true && contains(needs.*.result, 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/etl_manifest.json; then
            echo "Changes detected in data/etl_manifest.json. Committing and pushing to main..."
            git add data/etl_manifest.json
            git commit -m "chore(etl): update etl_manifest.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in data/etl_manifest.json. Repository is up-to-date."
          fi
