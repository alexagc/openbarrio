name: OpenBarrio Autonomous Data Pipeline (ETL)

on:
  schedule:
    # Run quarterly on the 1st of January, April, July, October at 03:00 UTC
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      all_provinces:
        description: 'Download all 52 Spanish provinces from INE ADRH (default: true)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run only (skip Cloudflare D1/R2 sync)'
        required: false
        default: false
        type: boolean
      force_sample:
        description: 'Force use of rich seed dataset without remote network downloads'
        required: false
        default: false
        type: boolean
      apply_only:
        description: 'Skip downloads and apply existing artifact directly to Cloudflare D1/R2'
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: 'Run ID of artifact to download (if apply_only is true, default: 40088381506)'
        required: false
        default: '40088381506'
        type: string

jobs:
  etl:
    name: Ingest & Process Public Open Datasets (INE & IGN)
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm for Wrangler
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies for Wrangler
        run: pnpm install --no-frozen-lockfile

      - name: Set up Python 3.11
        if: inputs.apply_only != true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Python dependencies
        if: inputs.apply_only != true
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt

      - name: Install Tippecanoe & GDAL
        if: inputs.apply_only != true
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev build-essential
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Ingest Public Open Datasets (INE ADRH & Cartography)
        if: inputs.apply_only != true
        run: |
          mkdir -p packages/etl/data packages/etl/dist
          ARGS="--all-provinces"
          if [ "${{ inputs.force_sample }}" = "true" ]; then
            ARGS="--force-sample"
          elif [ "${{ inputs.all_provinces }}" = "false" ]; then
            ARGS="--metropolitan-only"
          fi
          python3 packages/etl/src/download_datasets.py $ARGS

      - name: Run INE ADRH Processing (DuckDB -> D1 SQL)
        if: inputs.apply_only != true
        run: |
          python3 packages/etl/src/process_ine_adrh.py \
            --input packages/etl/data/ine_adrh_raw.csv \
            --output-sql packages/etl/dist/ine_adrh.sql \
            --output-db packages/etl/dist/ine_adrh.db

      - name: Run IGN Seccionado Censal Processing (DuckDB Spatial -> PMTiles)
        if: inputs.apply_only != true
        run: |
          python3 packages/etl/src/process_ign_boundaries.py \
            --input packages/etl/data/ign_secciones_censales.geojson \
            --output-pmtiles packages/etl/dist/census_tracts.pmtiles

      - name: Run Civic Facilities Processing (Python -> D1 SQL)
        if: inputs.apply_only != true
        run: |
          python3 packages/etl/src/process_civic_facilities.py \
            --output-sql packages/etl/dist/civic_facilities.sql

      - name: Download Processed National Artifacts (Fast Sync)
        if: inputs.apply_only == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packages/etl/dist
          TARGET_RUN="${{ inputs.artifact_run_id || '40088381506' }}"
          echo "Downloading processed artifacts from workflow run $TARGET_RUN..."
          gh run download "$TARGET_RUN" --dir packages/etl/dist
          if [ -d "packages/etl/dist/openbarrio-etl-dist" ]; then
            cp -r packages/etl/dist/openbarrio-etl-dist/* packages/etl/dist/
          fi
          echo "Verified downloaded files in packages/etl/dist:"
          ls -lh packages/etl/dist

      - name: Sync Cloudflare D1 (INE Income SQLite)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: d1 execute openbarrio-d1 --file=${{ github.workspace }}/packages/etl/dist/ine_adrh.sql --remote --yes

      - name: Sync Cloudflare D1 (Civic Facilities SQLite Chunks)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CHUNKS_DIR=""
          if [ -d "packages/etl/chunks" ] && [ $(ls -1 packages/etl/chunks/*.sql 2>/dev/null | wc -l) -gt 0 ]; then
            CHUNKS_DIR="packages/etl/chunks"
          elif [ -d "packages/etl/dist/openbarrio-etl-dist/chunks" ]; then
            CHUNKS_DIR="packages/etl/dist/openbarrio-etl-dist/chunks"
          elif [ -d "packages/etl/dist/chunks" ]; then
            CHUNKS_DIR="packages/etl/dist/chunks"
          fi

          if [ -n "$CHUNKS_DIR" ]; then
            echo "🚀 Found D1 migration chunks in $CHUNKS_DIR. Executing batch migration..."
            for chunk in "$CHUNKS_DIR"/*.sql; do
              echo ">>> Executing $chunk into Cloudflare D1..."
              pnpm --filter @openbarrio/api exec wrangler d1 execute openbarrio-d1 --file="$GITHUB_WORKSPACE/$chunk" --remote --yes
            done
            echo "✅ Successfully synced all civic facilities chunks to Cloudflare D1."
          elif [ -f "packages/etl/dist/civic_facilities.sql" ]; then
            echo "Executing monolithic civic_facilities.sql into Cloudflare D1..."
            pnpm --filter @openbarrio/api exec wrangler d1 execute openbarrio-d1 --file="$GITHUB_WORKSPACE/packages/etl/dist/civic_facilities.sql" --remote --yes
          fi

      - name: Sync Cloudflare R2 (PMTiles Vector Boundaries)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          workingDirectory: apps/api
          command: r2 object put openbarrio-r2/census_tracts.pmtiles --file=${{ github.workspace }}/packages/etl/dist/census_tracts.pmtiles

      - name: Upload Processed Artifacts (SQL & PMTiles)
        if: inputs.apply_only != true
        uses: actions/upload-artifact@v4
        with:
          name: openbarrio-etl-dist
          path: |
            packages/etl/dist/ine_adrh.sql
            packages/etl/dist/civic_facilities.sql
            packages/etl/dist/census_tracts.pmtiles
            packages/etl/dist/census_tracts_simplified.geojson
          retention-days: 30
