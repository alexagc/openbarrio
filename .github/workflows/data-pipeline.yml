name: OpenBarrio Autonomous Data Pipeline (ETL)

on:
  schedule:
    # Run quarterly on the 1st of January, April, July, October at 03:00 UTC
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      all_provinces:
        description: 'Download all 52 Spanish provinces from INE ADRH (otherwise metropolitan set)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run only (skip Cloudflare D1/R2 sync)'
        required: false
        default: false
        type: boolean
      force_sample:
        description: 'Force use of rich seed dataset without remote network downloads'
        required: false
        default: false
        type: boolean

jobs:
  etl:
    name: Ingest & Process Public Open Datasets (INE & IGN)
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'packages/etl/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/etl/requirements.txt

      - name: Install Tippecanoe & GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev build-essential
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Setup Node.js & pnpm for Wrangler
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest Public Open Datasets (INE ADRH & Cartography)
        run: |
          mkdir -p packages/etl/data packages/etl/dist
          ARGS=""
          if [ "${{ inputs.all_provinces }}" = "true" ]; then
            ARGS="$ARGS --all-provinces"
          fi
          if [ "${{ inputs.force_sample }}" = "true" ]; then
            ARGS="$ARGS --force-sample"
          fi
          python3 packages/etl/src/download_datasets.py $ARGS

      - name: Run INE ADRH Processing (DuckDB -> D1 SQL)
        run: |
          python3 packages/etl/src/process_ine_adrh.py \
            --input packages/etl/data/ine_adrh_raw.csv \
            --output-sql packages/etl/dist/ine_adrh.sql \
            --output-db packages/etl/dist/ine_adrh.db

      - name: Run IGN Seccionado Censal Processing (DuckDB Spatial -> PMTiles)
        run: |
          python3 packages/etl/src/process_ign_boundaries.py \
            --input packages/etl/data/ign_secciones_censales.geojson \
            --output-pmtiles packages/etl/dist/census_tracts.pmtiles

      - name: Sync Cloudflare D1 (INE Income SQLite)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute openbarrio-d1 --file=packages/etl/dist/ine_adrh.sql --remote

      - name: Sync Cloudflare R2 (PMTiles Vector Boundaries)
        if: inputs.dry_run != true && env.HAS_CF_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put openbarrio-r2/census_tracts.pmtiles --file=packages/etl/dist/census_tracts.pmtiles

      - name: Upload Processed Artifacts (SQL & PMTiles)
        uses: actions/upload-artifact@v4
        with:
          name: openbarrio-etl-dist
          path: |
            packages/etl/dist/ine_adrh.sql
            packages/etl/dist/census_tracts.pmtiles
            packages/etl/dist/census_tracts_simplified.geojson
          retention-days: 30
