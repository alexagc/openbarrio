name: Synthetic Portal DOM Monitoring

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  monitor-portals:
    name: Synthetic Portal DOM Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create artifacts directory
        run: mkdir -p test-results/synthetic

      - name: Execute Synthetic Monitoring Test Suite
        id: run_tests
        run: |
          echo "Starting synthetic monitoring for Spanish real estate portals..."
          pnpm --filter @openbarrio/extension test tests/synthetic-monitoring.test.ts --reporter=verbose 2>&1 | tee test-results/synthetic/synthetic-monitoring.log

      - name: Generate Extractor Health Report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const logPath = "test-results/synthetic/synthetic-monitoring.log";
            let logContent = "";
            if (fs.existsSync(logPath)) {
              logContent = fs.readFileSync(logPath, "utf-8");
            }

            const portals = ["idealista", "fotocasa", "habitaclia", "pisos", "yaencontre"];
            const portalStatus = {};
            let allPassed = true;

            for (const portal of portals) {
              const passedRegex = new RegExp(`Portal: \\[${portal.toUpperCase()}\\]`, "i");
              const hasPassed = passedRegex.test(logContent) && !logContent.includes(`FAIL  tests/synthetic-monitoring.test.ts`);
              portalStatus[portal] = {
                status: hasPassed ? "HEALTHY" : "DEGRADED",
                accuracy: hasPassed ? "100%" : "0%",
                verifiedAt: new Date().toISOString()
              };
              if (!hasPassed) allPassed = false;
            }

            const healthReport = {
              timestamp: new Date().toISOString(),
              overallStatus: allPassed ? "HEALTHY" : "DEGRADED",
              targetAccuracy: "100%",
              portals: portalStatus
            };

            const reportPath = "test-results/synthetic/extractor-health-report.json";
            fs.writeFileSync(reportPath, JSON.stringify(healthReport, null, 2));

            // Generate GitHub Step Summary
            const summary = [
              "## 🛡️ Synthetic Portal DOM Health Report",
              "",
              `**Overall Health:** ${allPassed ? "✅ HEALTHY (100% Accuracy)" : "⚠️ DEGRADED"}`,
              `**Timestamp:** \`${healthReport.timestamp}\``,
              "",
              "| Portal | Status | Accuracy | Verification |",
              "| :--- | :--- | :--- | :--- |",
              `| **Idealista** | ${portalStatus.idealista.status === "HEALTHY" ? "🟢 Healthy" : "🔴 Degraded"} | ${portalStatus.idealista.accuracy} | DOM Snapshot & JSON-LD |`,
              `| **Fotocasa** | ${portalStatus.fotocasa.status === "HEALTHY" ? "🟢 Healthy" : "🔴 Degraded"} | ${portalStatus.fotocasa.accuracy} | DOM Snapshot & NextData |`,
              `| **Habitaclia** | ${portalStatus.habitaclia.status === "HEALTHY" ? "🟢 Healthy" : "🔴 Degraded"} | ${portalStatus.habitaclia.accuracy} | DOM Snapshot & Microdata |`,
              `| **Pisos.com** | ${portalStatus.pisos.status === "HEALTHY" ? "🟢 Healthy" : "🔴 Degraded"} | ${portalStatus.pisos.accuracy} | DOM Snapshot & OpenGraph |`,
              `| **Yaencontre** | ${portalStatus.yaencontre.status === "HEALTHY" ? "🟢 Healthy" : "🔴 Degraded"} | ${portalStatus.yaencontre.accuracy} | DOM Snapshot & Features |`,
              "",
              "> *Automated synthetic check generated by OpenBarrio Phase 22 CI pipeline.*"
            ].join("\n");

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
            }
            console.log(summary);
          '

      - name: Archive Test Logs and Health Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-monitoring-health-status
          path: test-results/synthetic/
          retention-days: 30
